<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Degradados principales -->
    <linearGradient id="jarvisOuterRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="jarvisCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jarvisBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <!-- Filtro de resplandor neón -->
    <filter id="jarvisNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo circular oscuro futurista -->
  <circle cx="50" cy="50" r="48" fill="url(#jarvisBg)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>

  <!-- Anillo exterior tecnológico segmentado -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#jarvisOuterRing)" stroke-width="3" stroke-dasharray="14 5 7 5" opacity="0.9"/>
  <circle cx="50" cy="50" r="36" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Marcadores cardinales de precisión -->
  <line x1="50" y1="4" x2="50" y2="10" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="90" x2="50" y2="96" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4" y1="50" x2="10" y2="50" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="50" x2="96" y2="50" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Segmentos del reactor (Pétalos de energía estilo Arc Reactor JARVIS) -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="rgba(14, 165, 233, 0.25)" filter="url(#jarvisNeon)">
    <polygon points="50,19 44,28 56,28"/>
    <polygon points="50,81 44,72 56,72"/>
    <polygon points="19,50 28,44 28,56"/>
    <polygon points="81,50 72,44 72,56"/>
    <polygon points="28,28 32,38 40,32"/>
    <polygon points="72,28 68,38 60,32"/>
    <polygon points="28,72 32,62 40,68"/>
    <polygon points="72,72 68,62 60,68"/>
  </g>

  <!-- Núcleo central con resplandor intenso -->
  <circle cx="50" cy="50" r="18" fill="url(#jarvisCenterGlow)" filter="url(#jarvisNeon)"/>
  <circle cx="50" cy="50" r="12" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.85"/>
  <polygon points="50,38 60,44 60,56 50,62 40,56 40,44" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Emitter central -->
  <circle cx="50" cy="50" r="4" fill="#ffffff" filter="url(#jarvisNeon)"/>
</svg>
